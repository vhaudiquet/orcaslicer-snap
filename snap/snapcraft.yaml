name: orcaslicer
base: core24
adopt-info: orcaslicer
summary: an open source Next-Gen Slicing Software for Precision 3D Prints
description: |
 Optimize your prints with ultra-fast slicing, intelligent support generation, 
 and seamless printer compatibility — engineered for perfection.
license: AGPL-3.0-only

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

compression: lzo
grade: stable
confinement: strict

layout:
  /usr/local/share/OrcaSlicer:
    symlink: $SNAP/usr/local/share/OrcaSlicer
  # The executable's RUNPATH is $ORIGIN/../libpython/lib and the plugin runtime
  # looks for the bundled interpreter at this absolute path, both baked in at
  # build time from CMAKE_PREFIX_PATH=/usr/local.
  /usr/local/libpython:
    symlink: $SNAP/usr/local/libpython

apps:
  orcaslicer:
    environment:
      PATH: $SNAP/usr/local/bin:$PATH
      DISABLE_WAYLAND: '1'
      # Point OrcaSlicer directly at the system CA bundle so it doesn't show
      # the "use system SSL certificate" popup on every launch.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Enable GTK portal usage for WebKitGTK (Orca Cloud) to work inside the sandbox.
      # This allows WebKitGTK to use portals for network and other operations.
      GTK_USE_PORTAL: '1'
    extensions:
      - gnome
    common-id: com.orcaslicer.OrcaSlicer
    command-chain:
      - usr/local/bin/orca-slicer-launcher
    command: usr/local/bin/orca-slicer
    desktop: usr/local/share/applications/OrcaSlicer.desktop
    plugs:
      - unity7
      - home
      - network
      - network-bind
      - network-status
      - removable-media
      - hardware-observe
      - mount-observe
      - raw-usb
      - serial-port
      - udisks2
      - cups
      - browser-support

parts:
  launcher:
    plugin: dump
    source: snap/local
    organize:
      orca-slicer-launcher: usr/local/bin/orca-slicer-launcher
      OrcaSlicer.desktop: usr/local/share/applications/OrcaSlicer.desktop
    prime:
      - usr/local/bin/orca-slicer-launcher
      - usr/local/share/applications/OrcaSlicer.desktop

  orcaslicer:
    plugin: cmake
    source: https://github.com/OrcaSlicer/OrcaSlicer.git
    source-tag: v2.3.2
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - gettext
      - git
      - m4
      - autoconf
      - automake
      - libtool
      - texinfo
      - wget
      - file
      - libglvnd-dev
      - libglew-dev
      - libsecret-1-dev
      - libudev-dev
      - libdbus-1-dev
      - libgtk-3-dev
      - libcurl4-openssl-dev
      - libssl-dev
      - libgstreamerd-3-dev
      - gstreamer1.0-gtk3
      - libmspack-dev
      - libspnav-dev
      - libwebkit2gtk-4.1-dev
      - extra-cmake-modules
      - clang
      - lld
      - ccache
      # FFmpeg 7 (new dependency since 2.5.0) runs ./configure with x86 assembly
      # enabled, and its configure dies when nasm/yasm is missing:
      #   "nasm/yasm not found or too old. Use --disable-x86asm for a crippled build."
      - nasm
      # The bundled CPython is built with --enable-optimizations, and its PGO
      # step needs llvm-profdata when CC is clang, which the build environment
      # exports. Without it that dep dies at configure time with
      #   "llvm-profdata is required for a --enable-optimizations build".
      # The `llvm` metapackage is the one that ships /usr/bin/llvm-profdata,
      # matching the clang 18 that `clang` installs; llvm-18 alone only
      # provides the versioned name, which configure does not look for.
      - llvm

    stage-packages:
      - xdg-utils
      - util-linux
      - udisks2
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-x
      - libsecret-1-dev
      - libwebkit2gtk-4.1-0
      - libmspack0t64
      - libproxy1v5
      - glib-networking

    build-environment:
      # Must be a single directory: OrcaSlicer 2.5.0 appends /lib and /libpython
      # to ${CMAKE_PREFIX_PATH} and passes the result straight to file(COPY) and
      # find_package(Python3), so a list value makes it copy /usr/local wholesale
      # and fail on the other entries. /usr/local is where the deps part installs
      # (it is configured with DESTDIR=/).
      - CMAKE_PREFIX_PATH: /usr/local
      - PKG_CONFIG_PATH: $CRAFT_PART_BUILD/usr/local/lib/pkgconfig
      - CC: clang
      - CXX: clang++
      - LDFLAGS: -fuse-ld=lld

      # The `gnome` extension puts the gnome-46-2404 SDK on PATH, so pkg-config
      # resolves zlib/libpng/... to the SDK and emits its includedir as a plain
      # -I/snap/gnome-46-2404-sdk/current/usr/include. That directory also holds
      # the SDK's glibc headers, and once they are picked up with -I the compiler
      # no longer treats them as system headers: the host libstdc++ <cstdio> and
      # the SDK <stdio.h> then disagree, and C++ builds of the deps die with
      # "declaration of 'vsnprintf' has a different exception specifier" while
      # compiling wxWidgets. Re-adding the same directories with -idirafter makes
      # the compiler drop the plain -I copies and search them *after* the real
      # system directories, so the host glibc headers keep winning.
      - CFLAGS: -idirafter /snap/gnome-46-2404-sdk/current/usr/include/${CRAFT_ARCH_TRIPLET_BUILD_FOR} -idirafter /snap/gnome-46-2404-sdk/current/usr/include
      - CXXFLAGS: -idirafter /snap/gnome-46-2404-sdk/current/usr/include/${CRAFT_ARCH_TRIPLET_BUILD_FOR} -idirafter /snap/gnome-46-2404-sdk/current/usr/include

    override-pull: |
      # Make sure that errors abort pipeline, treat unset variables as errors,
      # print each command before execution and make all commands in pipes important
      set -euxo pipefail

      craftctl default

      # Get version from git tag
      _version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
      _commit="$(git rev-parse --short HEAD)"

      # Set Snap package version
      craftctl set version="${_version}"
      craftctl set grade=stable

      # Update build ID in version.inc
      sed -i "s/+UNKNOWN/_${_commit}/" version.inc

    override-build: |
      # Make sure that errors abort pipeline, treat unset variables as errors,
      # print each command before execution and make all commands in pipes important
      set -euxo pipefail

      unset LD_LIBRARY_PATH
      cp -a "${CRAFT_PART_SRC}"/* "${CRAFT_PART_BUILD}"

      # CPython's PGO step looks the profile tool up under its unversioned
      # name. The llvm package provides it that way; if an image ever ships
      # only the versioned binary, link it here rather than fail the whole
      # build 20 minutes in with "llvm-profdata ... could not be found".
      command -v llvm-profdata >/dev/null 2>&1 || ln -sfn /usr/lib/llvm-18/bin/llvm-profdata /usr/local/bin/llvm-profdata

      # OrcaSlicer 2.5.0 and 2.5.1 pin wxWidgets to commit b44c39c of
      # OrcaSlicer/Orca-deps-wxWidgets with GIT_SHALLOW ON, and a --depth 1
      # clone only carries the current tips of the remote. Once the wx branch
      # has moved past the pin, checking it out fails with "unable to read
      # tree" unless some tag happens to still point at it, so the build rests
      # on refs nobody promised to keep. 2.5.2 turns the option off for this
      # reason; do the same so older tags stay buildable.
      if [ -f deps/wxWidgets/wxWidgets.cmake ]; then
        sed -i 's/GIT_SHALLOW ON/GIT_SHALLOW OFF/' deps/wxWidgets/wxWidgets.cmake
      fi

      # The GNOME SDK exposes libva, so OpenCV detects VA support and then fails
      # to compile it: the SDK's va/va.h is not on the include path its
      # pkg-config entry advertises. Upstream builds without VA in practice, so
      # turn it off explicitly before the deps are configured.
      if [ -f deps/OpenCV/OpenCV.cmake ] && \
         ! grep -q -- '-DWITH_VA=OFF' deps/OpenCV/OpenCV.cmake; then
        sed -i 's|^\(\s*\)-DWITH_OPENCL=OFF|&\n\1-DWITH_VA=OFF\n\1-DWITH_VA_INTEL=OFF|' \
          deps/OpenCV/OpenCV.cmake
      fi

      # The bundled CPython is configured by upstream with
      # --enable-optimizations, and with CC=clang that turns its build into a
      # PGO pipeline: an instrumented build, a run of the test suite to collect
      # profile data, then a second build against it. In this confined build
      # that pipeline never converges - the job log shows two full instrumented
      # builds and then a failure - and it needs llvm-profdata plus a working
      # test run to produce profile data at all. The interpreter ships only to
      # run OrcaSlicer's plugin and firmware-download helpers, where PGO buys a
      # few percent at best, so build it plain and keep the dep deterministic.
      if [ -f deps/python3/python3.cmake ]; then
        # Range-limited to the Linux branch; the two macOS ones never run here.
        sed -i -e '/^    set(_conf_cmd \.\/configure$/,/^    )$/ s|^\(\s*\)--enable-optimizations$|\1# --enable-optimizations  # dropped: see snapcraft.yaml|' \
          deps/python3/python3.cmake
        if awk '/^    set\(_conf_cmd \.\/configure$/,/^    \)$/' deps/python3/python3.cmake \
           | grep -qE '^[[:space:]]*--enable-optimizations'; then
          echo "error: could not drop --enable-optimizations from deps/python3" >&2
          exit 1
        fi
      fi

      # Build dependencies first (as configured upstream)
      cd deps

      # One dependency at a time, each one still using every core. Every dep is
      # an ExternalProject whose inner build gets its own -j, so a parallel
      # top-level build multiplies the two: with the ~20 dependencies OrcaSlicer
      # 2.5.x pulls in (FFmpeg, CPython, Assimp, libdatachannel and SolveSpace on
      # top of Boost/OCCT/OpenVDB/wxWidgets/...) a 4-core runner ends up running
      # dozens of C++ compilers at once and the OOM killer takes the build down.
      # Upstream's build_linux.sh documents the same thing ("it's recommended to
      # use ninja -j1 for the top level"). CMAKE_BUILD_PARALLEL_LEVEL is read at
      # configure time by orcaslicer_add_cmake_project (which then drops its own
      # -j$(nproc)) and by FFmpeg's `make -j`, so export it before configuring.
      export CMAKE_BUILD_PARALLEL_LEVEL="${CRAFT_PARALLEL_BUILD_COUNT:-$(nproc)}"

      cmake . \
        -DDESTDIR=/ \
        -DDEP_WX_GTK3=1 \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_CXX_FLAGS=-Wno-deprecated-declarations \
        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
        -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
        -G Ninja
      # The deps build prints megabytes of compiler command lines, and when a
      # part fails snapcraft prints only a truncated copy of that output: the
      # real error sits past the truncation point and is lost. Tee it to a file
      # under the /tmp name the workflow's failure step already collects, so
      # the tail of the real log reaches the public job log.
      if ! ninja -j1 2>&1 | tee /tmp/snapcraft-deps-build.log; then
        exit 1
      fi
      cd ..

      # Build OrcaSlicer using an out-of-source build directory (_build).
      # This is required to avoid a self-referential symlink bug in
      # OrcaSlicer's CMake: src/CMakeLists.txt runs
      #   ln -sfn "${SLIC3R_RESOURCES_DIR}" "${BIN_RESOURCES_DIR}"
      # as a POST_BUILD step to let the in-tree binary find resources.
      # BIN_RESOURCES_DIR resolves to <binary_dir>/../resources. With an
      # in-source build both paths are identical, so ln creates
      #   resources/resources -> <build>/resources   (self-referential)
      # which the FHS install(DIRECTORY) then includes in the snap, causing
      # the Snap Store to reject it. With an out-of-source build the symlink
      # lands in _build/resources (never installed) and the real resources
      # directory stays clean.
      # CMAKE_CXX_FLAGS is set explicitly here, which replaces the value CMake
      # would take from the build-environment CXXFLAGS, so the -idirafter
      # work-around is appended by hand.
      cmake -S . -B _build \
        -DCMAKE_INSTALL_PREFIX=/usr/local \
        -DCMAKE_PREFIX_PATH=/usr/local \
        -DSLIC3R_ASAN=OFF \
        -DSLIC3R_STATIC=ON \
        -DSLIC3R_FHS=ON \
        -DSLIC3R_BUILD_TESTS=OFF \
        -DSLIC3R_GTK=3 \
        -DSLIC3R_PCH=OFF \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        "-DCMAKE_CXX_FLAGS=-Wno-deprecated-declarations ${CXXFLAGS:-}" \
        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
        -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
        -G Ninja

      ninja -C _build -j${CRAFT_PARALLEL_BUILD_COUNT:-$(nproc)}
      DESTDIR="${CRAFT_PART_INSTALL}" ninja -C _build install

      # OrcaSlicer 2.5.0 embeds the bundled CPython that runs its plugins. The
      # deps part installs it to /usr/local/libpython, and the binary carries
      # INSTALL_RPATH $ORIGIN/../libpython/lib to find it from /usr/local/bin.
      # The project's FHS install rules ship no Python runtime, so copy it in.
      if [ ! -d /usr/local/libpython ]; then
        echo "ERROR: bundled Python missing at /usr/local/libpython (deps build did not install it)" >&2
        exit 1
      fi
      cp -a /usr/local/libpython "${CRAFT_PART_INSTALL}/usr/local/"

      # Install SVG icon (upstream only installs PNGs)
      mkdir -p "${CRAFT_PART_INSTALL}/usr/local/share/icons/hicolor/scalable/apps"
      if [ -f "${CRAFT_PART_BUILD}/resources/images/OrcaSlicer.svg" ]; then
        cp "${CRAFT_PART_BUILD}/resources/images/OrcaSlicer.svg" \
           "${CRAFT_PART_INSTALL}/usr/local/share/icons/hicolor/scalable/apps/"
      fi

    override-prime: |
      craftctl default

      # Disable OrcaSlicer's built-in update checker. Snaps are updated through
      # the store, so the in-app updater is redundant. It also crashes on certain
      # system pango versions when rendering emoji in the release notes dialog
      # (NULL pointer dereference in ensure_faces() / pango_fc_font_map_get_face).
      python3 "${CRAFT_PROJECT_DIR}/snap/local/patch-updater-url.py" \
        "${CRAFT_PRIME}/usr/local/bin/orca-slicer"

    stage:
      # Desktop files are owned by the 'launcher' part (snap/local/*.desktop);
      # exclude them here to avoid a stage conflict with the cached build.
      - -usr/local/share/applications/OrcaSlicer.desktop

    prime:
      - -usr/share/man
      - -usr/share/doc-base
      - -usr/share/lintian

  # Remove Mesa libraries that stage-packages pull in transitively
  # (libwebkit2gtk-4.1-0, gstreamer plugins, etc.) and that would shadow the
  # ABI-compatible versions provided by the gpu-2404 content interface at
  # runtime, causing a crash in libgallium during EGL initialisation.
  # gpu-2404-cleanup is the canonical way to handle this; it removes every
  # file in $CRAFT_PRIME that is already provided by the mesa-2404 content
  # snap, keeping the list in sync with whatever that snap ships.
  gpu-2404:
    after:
      - orcaslicer
      - launcher
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404

  cleanup:
    after:
      - gpu-2404
    plugin: nil
    build-snaps:
      - gnome-46-2404
    override-prime: |
      # Make sure that errors abort pipeline, treat unset variables as errors,
      # print each command before execution and make all commands in pipes important
      set -euxo pipefail

      # Remove files already provided by the gnome extension
      for snap in "gnome-46-2404"; do
        cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" \;
      done

      # Remove cruft
      for CRUFT in bug lintian man; do
        rm -rf $CRAFT_PRIME/usr/share/$CRUFT
      done

      # Remove documentation except copyright
      find $CRAFT_PRIME/usr/share/doc/ -type f -not -name 'copyright' -delete 2>/dev/null || true
