name: Build and Release Snap

on:
  # Triggered automatically by release-monitor.yml when a new upstream release
  # is detected, or manually to build a specific version.
  workflow_dispatch:
    inputs:
      version:
        description: 'OrcaSlicer version to build (e.g., v2.3.2), or "latest"'
        required: false
        default: 'latest'
      edge:
        description: 'Build from main branch (edge channel)'
        required: false
        default: false
        type: boolean
      reuse_run_id:
        description: 'Skip build and publish artifacts from this prior run ID instead'
        required: false
        default: ''

  # Build and smoke-test on every PR that touches the snap definition.
  pull_request:
    branches: [main]
    paths:
      - 'snap/snapcraft.yaml'
      - 'snap/local/**'
      - '.github/workflows/snap-build.yml'

  # Allow external triggers (e.g. from a repository_dispatch event).
  repository_dispatch:
    types: [orcaslicer-release]

env:
  SNAPCRAFT_BUILD_ENVIRONMENT: host

jobs:
  # Determine the version and snap track once; all downstream jobs read these
  # outputs so the derivation logic lives in exactly one place.
  setup:
    name: Determine build parameters
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.params.outputs.version }}

    steps:
      - name: Resolve version and track
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [ "${{ github.event.inputs.edge }}" = "true" ]; then
            VERSION="edge"
          elif [ -n "${{ github.event.inputs.version }}" ] \
            && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # PRs and 'latest' dispatches: build whatever is newest upstream
            VERSION=$(curl -s https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest \
              | jq -r '.tag_name')
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  build-snap:
    name: Build Snap (${{ matrix.architecture }})
    needs: setup
    if: github.event.inputs.reuse_run_id == ''
    # Each architecture builds on its own native runner
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pin source-tag in snapcraft.yaml
        # For edge builds we leave the source as-is (main branch); for every
        # other case we update the tag so Snapcraft fetches the right commit.
        if: needs.setup.outputs.version != 'edge'
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          TAG="${VERSION#v}"
          sed -i "s/source-tag:.*/source-tag: v${TAG}/" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1.3.0
        id: build
        with:
          # Explicit 'pack' subcommand: bare 'snapcraft' is deprecated
          snapcraft-args: pack

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: orcaslicer-${{ matrix.architecture }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.architecture }}
          path: |
            ~/.local/state/snapcraft/log/*.log
            /tmp/snapcraft-*.log

  test-snap:
    name: Test Snap
    needs: build-snap
    if: github.event.inputs.reuse_run_id == ''
    runs-on: ubuntu-24.04

    steps:
      - name: Download amd64 snap artifact
        uses: actions/download-artifact@v8
        with:
          name: orcaslicer-amd64
          path: ./snap-artifacts

      - name: Install snap
        run: sudo snap install --dangerous ./snap-artifacts/*.snap

      - name: Verify binary is present
        run: ls -la /snap/orcaslicer/current/usr/local/bin/orca-slicer

      - name: Check snap interfaces
        run: snap interfaces orcaslicer

  publish-snap:
    name: Publish to Snap Store
    needs: [setup, build-snap, test-snap]
    permissions:
      contents: write
    # Never publish from PRs; only publish from the main branch.
    # build-snap and test-snap are skipped (result: skipped) when reuse_run_id
    # is set, so we use always() + an explicit check instead of the default
    # "all needs succeeded" behaviour.
    if: |
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.setup.result == 'success'
      && (needs.build-snap.result == 'success' || needs.build-snap.result == 'skipped')
      && (needs.test-snap.result == 'success'  || needs.test-snap.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download snap artifacts from this run
        if: github.event.inputs.reuse_run_id == ''
        uses: actions/download-artifact@v8
        with:
          path: ./snap-artifacts
          pattern: orcaslicer-*
          merge-multiple: true

      - name: Download snap artifacts from prior run
        if: github.event.inputs.reuse_run_id != ''
        uses: actions/download-artifact@v8
        with:
          path: ./snap-artifacts
          pattern: orcaslicer-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine snap channel
        id: channel
        run: |
          if [ "${{ github.event.inputs.edge }}" = "true" ]; then
            CHANNEL="latest/edge"
          else
            CHANNEL="latest/stable"
          fi
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Publishing to channel: ${CHANNEL}"

      - name: Install Snapcraft
        run: sudo snap install --classic snapcraft

      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          for snap_file in ./snap-artifacts/*.snap; do
            echo "Uploading ${snap_file} to channel ${CHANNEL}..."
            snapcraft upload "${snap_file}" --release "${CHANNEL}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: OrcaSlicer ${{ needs.setup.outputs.version }}
          files: ./snap-artifacts/*.snap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notify on build failure
    needs: [setup, build-snap, test-snap, publish-snap]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Snap build failed for ${{ needs.setup.outputs.version }}`,
              body: `The automated snap build failed.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and fix the issue.`,
              labels: ['build-failure', 'automated']
            })
